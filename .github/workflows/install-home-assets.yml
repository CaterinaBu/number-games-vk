name: Install home image assets

on:
  push:
    paths:
      - '.asset-staging/READY'

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild image archive
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/part-* > /tmp/home_assets.b64
          base64 -d /tmp/home_assets.b64 > /tmp/home_assets.zip
          mkdir -p src/assets/home
          unzip -o /tmp/home_assets.zip -d src/assets/home
          ls -lh src/assets/home

      - name: Commit real binary assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-staging
          rm -f .github/workflows/install-home-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install high-quality home artwork [skip ci]"
          git push
